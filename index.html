<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Collections Wiki Masters</title>
    <style>
        :root {
            --bg: #0e0f12;
            --surface: #18191d;
            --surface-hover: #22242a;
            --fg: #eceef2;
            --fg-muted: #9ca3af;
            --accent: #ffb224;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--fg);
            line-height: 1.5;
            padding-bottom: 4rem;
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(14, 15, 18, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #2a2c33;
            padding: 1rem 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            justify-content: space-between;
        }

        h1 { font-size: 1.5rem; font-weight: 700; color: var(--accent); }

        #search {
            background: var(--surface);
            border: 1px solid #2a2c33;
            color: var(--fg);
            padding: 0.6rem 1rem;
            border-radius: var(--radius);
            font-size: 0.95rem;
            width: 100%;
            max-width: 400px;
            transition: border-color 0.2s;
        }
        #search:focus { outline: none; border-color: var(--accent); }

        /* Navigation (Onglets) */
        nav {
            padding: 1rem 2rem;
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            scrollbar-width: none;
        }
        nav::-webkit-scrollbar { display: none; }

        .tab {
            background: var(--surface);
            border: 1px solid #2a2c33;
            color: var(--fg-muted);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .tab:hover { background: var(--surface-hover); color: var(--fg); }
        .tab.active {
            background: var(--accent);
            color: #000;
            font-weight: 600;
            border-color: var(--accent);
        }

        /* Grille de cartes */
        main {
            padding: 1rem 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Carte individuelle */
        .card {
            background: var(--surface);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            border: 1px solid #2a2c33;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
            border-color: #3f424d;
        }

        .card-image {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background: #2a2c33;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        /* Placeholder si pas d'image */
        .card-image.placeholder {
            font-size: 3rem;
            font-weight: 800;
            color: rgba(255,255,255,0.1);
            background: linear-gradient(135deg, #1f2128 0%, #2a2c33 100%);
        }

        .card-body {
            padding: 1rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--fg);
            line-height: 1.3;
        }

        .card-desc {
            font-size: 0.85rem;
            color: var(--fg-muted);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex: 1;
        }

        .card-footer {
            margin-top: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
        }

        .rarity-badge {
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Couleurs de rareté */
        .r-L { background: rgba(255, 215, 0, 0.15); color: #ffd700; border: 1px solid rgba(255, 215, 0, 0.3); }
        .r-UR { background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); }
        .r-SR { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
        .r-R { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
        .r-PC { background: rgba(148, 163, 184, 0.15); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.3); }
        .r-C { background: rgba(100, 116, 139, 0.15); color: #64748b; border: 1px solid rgba(100, 116, 139, 0.3); }

        .loading-spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            color: var(--fg-muted);
        }

        @media (max-width: 600px) {
            header { padding: 1rem; }
            nav { padding: 0.5rem 1rem; }
            main { padding: 1rem; grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<header>
    <h1>🗃️ Mes Collections</h1>
    <input type="text" id="search" placeholder="Filtrer par titre ou description...">
</header>

<nav id="tabs">
    <!-- Les onglets seront générés ici -->
</nav>

<main id="grid">
    <div class="empty-state">Chargement des collections...</div>
</main>

<script>
    // Configuration
    const DATA_URL = 'data.json';
    const LISTES_URL = 'listes.json';
    
    // Cache pour éviter de spammer l'API Wikipédia
    const wikiCache = new Map();

    // État de l'application
    let allCardsData = new Map();
    let collections = [];
    let currentFilter = 'all';
    let searchQuery = '';

    // 1. Chargement des données
    async function init() {
        try {
            const [dataRes, listesRes] = await Promise.all([
                fetch(DATA_URL),
                fetch(LISTES_URL)
            ]);

            if (!dataRes.ok || !listesRes.ok) throw new Error("Erreur de chargement des fichiers JSON");

            const dataJson = await dataRes.json();
            const listesJson = await listesRes.json();

            // Indexer les cartes par titre pour un accès O(1)
            // On gère le fait que data.json peut être un objet avec une clé "cards" ou un tableau direct
            const cardsArray = dataJson.cards || (Array.isArray(dataJson) ? dataJson : []);
            cardsArray.forEach(card => {
                allCardsData.set(card.t, card);
            });

            collections = listesJson.lists || listesJson;

            renderTabs();
            renderGrid();
        } catch (error) {
            document.getElementById('grid').innerHTML = `<div class="empty-state">❌ Erreur : ${error.message}<br>Vérifie que data.json et listes.json sont bien à la racine du dépôt.</div>`;
        }
    }

    // 2. Récupération intelligente via API Wikipédia (Fallback)
    async function getWikiInfo(title) {
        if (wikiCache.has(title)) return wikiCache.get(title);

        try {
            const response = await fetch(`https://fr.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`);
            if (response.ok) {
                const data = await response.json();
                const info = {
                    description: data.extract || "Aucune description disponible.",
                    image: data.thumbnail ? data.thumbnail.source : null
                };
                wikiCache.set(title, info);
                return info;
            }
        } catch (e) {
            console.warn("Échec récupération Wiki pour :", title);
        }
        
        const fallback = { description: "Description non disponible.", image: null };
        wikiCache.set(title, fallback);
        return fallback;
    }

    // 3. Rendu des onglets
    function renderTabs() {
        const nav = document.getElementById('tabs');
        nav.innerHTML = `<button class="tab active" data-id="all">Tout voir</button>`;
        
        collections.forEach(col => {
            const btn = document.createElement('button');
            btn.className = 'tab';
            btn.dataset.id = col.id;
            // Affiche le nombre de cartes possédées
            const count = col.have ? col.have.length : 0;
            btn.textContent = `${col.name} (${count})`;
            btn.onclick = () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = col.id;
                renderGrid();
            };
            nav.appendChild(btn);
        });
    }

    // 4. Rendu de la grille
    async function renderGrid() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '<div class="empty-state">Chargement...</div>';

        // Filtrer les collections
        let targetCollections = currentFilter === 'all' 
            ? collections 
            : collections.filter(c => c.id === currentFilter);

        // Extraire toutes les cartes possédées uniques
        const ownedTitles = new Set();
        targetCollections.forEach(col => {
            if (col.have) {
                col.have.forEach(title => ownedTitles.add(title));
            }
        });

        if (ownedTitles.size === 0) {
            grid.innerHTML = '<div class="empty-state">Aucune carte possédée dans cette collection.</div>';
            return;
        }

        grid.innerHTML = ''; // Clear loading

        // Créer les cartes
        for (const title of ownedTitles) {
            if (searchQuery && !title.toLowerCase().includes(searchQuery.toLowerCase())) {
                continue;
            }

            const cardData = allCardsData.get(title);
            const cardEl = createCardElement(title, cardData);
            grid.appendChild(cardEl);

            // Si l'image ou la description manque, on va la chercher
            if (!cardData || !cardData.i || !cardData.d) {
                enrichCardFromWiki(cardEl, title, cardData);
            }
        }

        if (grid.children.length === 0) {
            grid.innerHTML = '<div class="empty-state">Aucun résultat pour cette recherche.</div>';
        }
    }

    // 5. Création d'un élément carte HTML
    function createCardElement(title, cardData) {
        const div = document.createElement('div');
        div.className = 'card';
        
        const rarity = cardData?.r || 'C';
        const desc = cardData?.d || 'Chargement des données...';
        const imgUrl = cardData?.i;

        const imageHtml = imgUrl 
            ? `<img src="${imgUrl}" alt="${title}" class="card-image" loading="lazy" onerror="this.classList.add('placeholder'); this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2280%22 x=%2250%%22 text-anchor=%22middle%22 fill=%22%23555%22>${title.charAt(0)}</text></svg>';">`
            : `<div class="card-image placeholder"><div class="loading-spinner"></div></div>`;

        div.innerHTML = `
            ${imageHtml}
            <div class="card-body">
                <div class="card-title">${title}</div>
                <div class="card-desc">${desc}</div>
                <div class="card-footer">
                    <span class="rarity-badge r-${rarity}">${rarity}</span>
                    <span style="color: var(--fg-muted);">${cardData?.pv ? cardData.pv + ' vues' : ''}</span>
                </div>
            </div>
        `;
        
        // Stocker le titre pour mise à jour ultérieure
        div.dataset.title = title;
        return div;
    }

    // 6. Enrichissement asynchrone depuis Wikipédia
    async function enrichCardFromWiki(cardEl, title, cardData) {
        const wikiInfo = await getWikiInfo(title);
        
        // Mise à jour de l'image
        if (wikiInfo.image) {
            const imgContainer = cardEl.querySelector('.card-image');
            if (imgContainer.classList.contains('placeholder')) {
                const img = document.createElement('img');
                img.src = wikiInfo.image;
                img.alt = title;
                img.className = 'card-image';
                img.loading = 'lazy';
                imgContainer.replaceWith(img);
            }
        }

        // Mise à jour de la description si elle était manquante ou générique
        if (!cardData || !cardData.d) {
            const descEl = cardEl.querySelector('.card-desc');
            descEl.textContent = wikiInfo.description;
        }
    }

    // 7. Gestion de la recherche
    document.getElementById('search').addEventListener('input', (e) => {
        searchQuery = e.target.value.trim();
        renderGrid();
    });

    // Démarrage
    init();
</script>

</body>
</html>
