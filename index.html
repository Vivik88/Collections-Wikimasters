<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma Vitrine WikiMasters</title>
<style>
  :root { --bg:#0e0f12; --surface:#18191d; --border:#2a2c33; --fg:#eceef2; --muted:#9ca3af; --accent:#ffb224; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  header { position:sticky; top:0; z-index:10; background:rgba(14,15,18,.92); backdrop-filter:blur(8px);
           border-bottom:1px solid var(--border); padding:1rem 2rem; display:flex; flex-wrap:wrap; gap:1rem; justify-content:space-between; align-items:center; }
  h1 { font-size:1.4rem; color:var(--accent); }
  #bar { height:4px; background:var(--border); }
  #bar>i { display:block; height:100%; width:0; background:var(--accent); transition:width .3s; }
  #progress { font-size:.8rem; color:var(--muted); }
  nav { display:flex; gap:.5rem; overflow-x:auto; padding:1rem 2rem; scrollbar-width:none; }
  nav::-webkit-scrollbar{display:none}
  .tab { background:var(--surface); border:1px solid var(--border); color:var(--muted); padding:.5rem 1rem;
         border-radius:20px; cursor:pointer; white-space:nowrap; font-size:.9rem; }
  .tab.active { background:var(--accent); color:#000; font-weight:600; }
  main { padding:0 2rem 4rem; display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:1.2rem; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
  .imgbox { height:150px; background:#202228; display:flex; align-items:center; justify-content:center; font-size:3rem; color:rgba(255,255,255,.08); font-weight:800; }
  .imgbox img { width:100%; height:100%; object-fit:cover; }
  .body { padding:1rem; display:flex; flex-direction:column; gap:.5rem; flex:1; }
  .title { font-weight:600; line-height:1.3; }
  .desc { font-size:.82rem; color:var(--muted); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; flex:1; }
  .foot { display:flex; justify-content:space-between; align-items:center; font-size:.78rem; }
  .rar { padding:.15rem .5rem; border-radius:5px; font-weight:700; background:rgba(255,255,255,.06); }
  .r-UR,.r-L { color:#ffd700 } .r-SR { color:#c084fc } .r-R { color:#60a5fa } .r-PC { color:#4ade80 } .r-C { color:#94a3b8 }
  .stats b { color:var(--muted); font-weight:600; } .atk{color:#f87171}.def{color:#38bdf8}
  .tags { display:flex; flex-wrap:wrap; gap:.25rem; }
  .tg { font-size:.68rem; background:rgba(255,178,36,.12); color:var(--accent); padding:.1rem .45rem; border-radius:8px; }
  a { color:inherit; text-decoration:none; }
  #empty, #error { grid-column:1/-1; text-align:center; padding:3rem; color:var(--muted); }
  .btn { background:none; border:1px solid var(--border); color:var(--fg); padding:.4rem .8rem; border-radius:8px; cursor:pointer; font-size:.8rem; }
</style>
</head>
<body>
<header>
  <h1>🃏 Ma Vitrine</h1>
  <div style="display:flex;gap:1rem;align-items:center">
    <span id="progress"></span>
    <button id="dl" class="btn" style="display:none">💾 Télécharger cache titres</button>
  </div>
</header>
<div id="bar"><i></i></div>
<nav id="tabs"></nav>
<main id="grid"><div id="empty">Chargement…</div></main>

<script>
/* ====== CONFIG : tes collections, basées sur les TAGS de ton export ====== */
const COLLECTIONS = [
  { id:'all',       name:'Tout possédé',          tags:null },                 // toutes tes cartes
  { id:'avendre',   name:'À vendre 💸',            tags:['· A VENDRE 💸'] },
  { id:'foot',      name:'Foot ⚽',                 tags:['⚽ Foot'] },
  { id:'vosges',    name:'Vosges ♥️⛰️',            tags:['Vosges ♥️⛰️','xxx. [100%] ✅ Communes des Vosges'] },
  { id:'cs',        name:'Counter Strike 🔫',      tags:['Counter Strike 🔫'] },
];

const EXPORT_URL = 'ma-vitrine-wikimasters.json';
const CACHE_URL  = 'titres.json';                 // optionnel, à commiter pour aller vite
const WM_API     = id => `https://www.wiki-masters.com/api/cards/${id}`;
const WIKI_API   = t => `https://fr.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(t)}`;
const PROXIES    = [u=>`https://corsproxy.io/?url=${encodeURIComponent(u)}`,
                    u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`];

let data=[], cache={}, current='all', search='';

/* fetch avec bascule automatique si CORS bloque */
async function get(url){
  try { const r=await fetch(url); if(r.ok) return r.json(); throw 0; }
  catch { for(const p of PROXIES){ try{ const r=await fetch(p(url)); if(r.ok) return JSON.parse(await r.text()); }catch{} } return null; }
}
const save = ()=>{ localStorage.setItem('wm_cache', JSON.stringify(cache));
                  document.getElementById('dl').style.display = Object.keys(cache).length ? '' : 'none'; };
document.getElementById('dl').onclick = ()=>{
  const blob = new Blob([JSON.stringify(cache,null,1)],{type:'application/json'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='titres.json'; a.click();
};

async function init(){
  cache = JSON.parse(localStorage.getItem('wm_cache')||'{}');
  let exportData, extra={};
  try { exportData = await (await fetch(EXPORT_URL)).json(); }
  catch { document.getElementById('grid').innerHTML='<div id="error">❌ Impossible de charger '+EXPORT_URL+'</div>'; return; }
  try { extra = await (await fetch(CACHE_URL)).json(); } catch{}          // 404 = pas grave
  cache = {...extra, ...cache};

  // cartes possédées, dédupliquées par card_id (un titre peut avoir plusieurs exemplaires)
  const byId = new Map();
  (exportData.copies||[]).forEach(c => { if(!byId.has(c.card_id)) byId.set(c.card_id, c); });
  data = [...byId.values()];

  renderTabs();
  await enrichAndRender();
}

async function enrichAndRender(){
  const need = data.filter(c => !cache[c.card_id] || !cache[c.card_id].t);
  const bar=document.getElementById('bar').firstElementChild, prog=document.getElementById('progress');
  let done=0;
  for(const c of need){
    const wm = await get(WM_API(c.card_id));
    if(!wm){ cache[c.card_id]={t:'?',broken:true}; continue; }
    const wki = await get(WIKI_API(wm.wikipedia_title)).catch(()=>null);
    cache[c.card_id] = { t:wm.wikipedia_title, d:wki?.extract||'', i:wki?.thumbnail?.source||wm.image_url||null };
    save(); done++;
    bar.style.width=(done/need.length*100)+'%';
    prog.textContent=`Résolution des titres… ${done}/${need.length}`;
  }
  bar.style.width='0'; prog.textContent='';
  renderGrid();
}

function cardIn(col,c){ return col.tags===null || (c.tags||[]).some(t=>col.tags.includes(t)); }

function renderTabs(){
  const nav=document.getElementById('tabs'); nav.innerHTML='';
  COLLECTIONS.forEach(col=>{
    const n=data.filter(c=>cardIn(col,c)).length;
    const b=document.createElement('button'); b.className='tab'+(col.id===current?' active':'');
    b.textContent=`${col.name} (${n})`; b.onclick=()=>{current=col.id; renderTabs(); renderGrid();};
    nav.appendChild(b);
  });
}

function renderGrid(){
  const grid=document.getElementById('grid'); grid.innerHTML='';
  const col=COLLECTIONS.find(c=>c.id===current);
  const cards=data.filter(c=>cardIn(col,c));
  if(!cards.length){ grid.innerHTML='<div id="empty">Aucune carte.</div>'; return; }
  cards.forEach(c=>{
    const info=cache[c.card_id]||{};
    const el=document.createElement('div'); el.className='card';
    el.innerHTML=`
      <a class="imgbox" target="_blank" href="https://fr.wikipedia.org/wiki/${encodeURIComponent(info.t||'')}">
        ${info.i?`<img src="${info.i}" loading="lazy" onerror="this.remove()">`:(info.t||'?')[0].toUpperCase()}
      </a>
      <div class="body">
        <div class="title">${(c.shiny?'✨':'')+(c.starred?'⭐':'')+esc(info.t||'Chargement…')}</div>
        <div class="desc">${esc(info.d||'')}</div>
        <div class="tags">${(c.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join('')}</div>
        <div class="foot">
          <span class="rar r-${c.rarity}">${c.rarity}</span>
          <span class="stats">⚔️<b class="atk">${c.atk}</b> · 🛡️<b class="def">${c.def}</b></span>
        </div>
      </div>`;
    grid.appendChild(el);
  });
}
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
init();
</script>
</body>
</html>
